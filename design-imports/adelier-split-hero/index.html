<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adelier — Split Hero</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="adl-hero" aria-label="Adelier featured interiors">
  <div class="adl-panel adl-panel-a">
    <div class="adl-panel-inner">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 48%;opacity:1;transform:scale(1);">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 40%;opacity:0;transform:scale(1.045);">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 52%;opacity:0;transform:scale(1.045);">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1615529182904-14819c35db37?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 46%;opacity:0;transform:scale(1.045);">
    </div>
  </div>
  <div class="adl-panel adl-panel-b">
    <div class="adl-panel-inner">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 48%;opacity:1;transform:scale(1);">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 40%;opacity:0;transform:scale(1.045);">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 52%;opacity:0;transform:scale(1.045);">
      <img class="adl-layer" src="https://images.unsplash.com/photo-1615529182904-14819c35db37?w=2400&q=80&auto=format&fit=crop" alt="" style="object-position:center 46%;opacity:0;transform:scale(1.045);">
    </div>
  </div>
  <div class="adl-seam"></div>
  <div class="adl-scrim"></div>
  <div class="adl-scroll">
    <span class="adl-scroll-line"></span>
    <span class="adl-scroll-label">Scroll</span>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
